<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">

<title>返済計画</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:sans-serif;
    background:#f3f6f9;
    color:#333;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    margin:10px 0 20px;
    color:#1976d2;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card h2{
    margin-top:0;
    font-size:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    background:#1976d2;
    color:white;
}

button:active{
    opacity:0.8;
}

.save-button{
    background:#1976d2;
}

.pay-button{
    background:#2e7d32;
    font-size:18px;
    padding:16px;
}

.pay-button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.reset-button{
    background:#777;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.info-box{
    background:#f1f5f8;
    padding:14px;
    border-radius:10px;
    text-align:center;
}

.info-label{
    font-size:13px;
    color:#666;
}

.info-value{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}

.progress-area{
    margin-top:15px;
}

.progress-bar{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#1976d2;
    transition:width 0.3s;
}

.progress-text{
    text-align:center;
    margin-top:6px;
    font-weight:bold;
}

.note{
    font-size:13px;
    color:#666;
    margin-top:6px;
}

.month-paid{
    text-align:center;
    font-weight:bold;
    color:#2e7d32;
    margin-top:10px;
}

.complete{
    background:#e8f5e9;
    color:#2e7d32;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}

.schedule-header{
    display:flex;
    align-items:center;
}

.schedule-header h2{
    margin-bottom:10px;
}

.schedule-toggle{
    background:#e8edf2;
    color:#333;
    margin-top:0;
    margin-bottom:10px;
}

.payment-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.payment-list.hidden{
    display:none;
}

.payment-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:9px;
    background:#f5f7f9;
    border-left:5px solid #1976d2;
}

.payment-item.paid{
    background:#e8f5e9;
    border-left-color:#2e7d32;
}

.payment-main{
    min-width:0;
}

.payment-number{
    font-weight:bold;
}

.payment-period{
    font-size:13px;
    color:#666;
    margin-top:3px;
}

.payment-right{
    text-align:right;
    margin-left:10px;
}

.payment-amount{
    font-weight:bold;
}

.paid-mark{
    color:#2e7d32;
    font-size:13px;
    font-weight:bold;
    margin-top:3px;
}

.hidden{
    display:none;
}


/* =================================
   完済花火
================================= */

#fireworksCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:9998;
    pointer-events:none;
    display:none;
}

#celebration{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

.celebration-message{
    text-align:center;
    font-weight:bold;
    padding:25px;
    animation:celebrationPop 0.8s ease-out;
}

.celebration-title{
    font-size:46px;
    color:#fff;
    text-shadow:
        0 0 5px #ff9800,
        0 0 15px #ff9800,
        0 0 30px #ff5722;
    white-space:nowrap;
}

.celebration-sub{
    font-size:30px;
    color:#fff;
    margin-top:12px;
    text-shadow:
        0 0 5px #2196f3,
        0 0 15px #2196f3,
        0 0 30px #03a9f4;
}

@keyframes celebrationPop{

    0%{
        transform:scale(0.2);
        opacity:0;
    }

    70%{
        transform:scale(1.15);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@media(max-width:500px){

    .celebration-title{
        font-size:38px;
    }

    .celebration-sub{
        font-size:25px;
    }

}

</style>
</head>

<body>


<!-- ==============================
     完済花火
============================== -->

<canvas id="fireworksCanvas"></canvas>

<div id="celebration">

    <div class="celebration-message">

        <div class="celebration-title">
            🎉 完済しました！
        </div>

        <div class="celebration-sub">
            お疲れさまでした！
        </div>

    </div>

</div>


<div class="container">

<h1>💰 返済計画</h1>


<!-- 設定 -->
<div class="card">

    <h2>⚙️ 返済設定</h2>

    <label>借入残高</label>

    <input
        type="number"
        id="loanAmount"
        placeholder="例：680000"
    >


    <label>毎月の返済額</label>

    <input
        type="number"
        id="monthlyPayment"
        placeholder="例：10000"
    >


    <label>初回返済月</label>

    <input
        type="month"
        id="startDate"
    >

    <div class="note">
        ※返済期間は毎月「26日〜月末」です
    </div>


    <button
        class="save-button"
        onclick="saveSettings()"
    >
        💾 設定を保存
    </button>

</div>


<!-- 現在の状況 -->
<div class="card">

    <h2>📊 現在の状況</h2>

    <div class="info">

        <div class="info-box">

            <div class="info-label">
                残り返済額
            </div>

            <div
                class="info-value"
                id="remainingAmount"
            >
                0円
            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                残り回数
            </div>

            <div
                class="info-value"
                id="remainingCount"
            >
                0回
            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                返済済み
            </div>

            <div
                class="info-value"
                id="paidCount"
            >
                0回
            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                全返済回数
            </div>

            <div
                class="info-value"
                id="totalCount"
            >
                0回
            </div>

        </div>

    </div>


    <div class="progress-area">

        <div class="progress-bar">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>

        <div
            class="progress-text"
            id="progressText"
        >
            0%
        </div>

    </div>

</div>


<!-- 今月の返済 -->
<div class="card">

    <h2>💴 今月の返済</h2>

    <button
        class="pay-button"
        id="thisMonthButton"
        onclick="payThisMonth()"
    >
        ✅ 今月返済した！
    </button>

    <div
        class="month-paid"
        id="monthPaid"
    ></div>

</div>


<!-- 返済予定 -->
<div class="card">

    <div class="schedule-header">

        <h2>📅 返済予定</h2>

    </div>


    <button
        class="schedule-toggle"
        id="scheduleToggle"
        onclick="toggleSchedule()"
    >
        📅 返済予定を見る
    </button>


    <div
        class="payment-list hidden"
        id="paymentList"
    ></div>

</div>


<!-- リセット -->
<div class="card">

    <button
        class="reset-button"
        onclick="resetData()"
    >
        🔄 データをリセット
    </button>

</div>

</div>


<script>


/* =================================
   返済予定 開閉
================================= */

let scheduleOpen = false;


function toggleSchedule(){

    scheduleOpen =
        !scheduleOpen;


    const list =
        document.getElementById(
            "paymentList"
        );


    const button =
        document.getElementById(
            "scheduleToggle"
        );


    if(scheduleOpen){

        list.classList.remove(
            "hidden"
        );

        button.textContent =
            "📅 返済予定を閉じる";

    }else{

        list.classList.add(
            "hidden"
        );

        button.textContent =
            "📅 返済予定を見る";

    }

}


/* =================================
   今日の日付
================================= */

function getToday(){

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


/* =================================
   初回返済月
================================= */

function getDefaultStartMonth(){

    const today =
        new Date();


    return `${today.getFullYear()}-${
        String(
            today.getMonth() + 1
        ).padStart(2,"0")
    }`;

}


/* =================================
   初期化
================================= */

function initialize(){

    const settings =
        JSON.parse(
            localStorage.getItem(
                "repaymentSettings"
            ) || "null"
        );


    if(settings){

        document.getElementById(
            "loanAmount"
        ).value =
            settings.loanAmount;


        document.getElementById(
            "monthlyPayment"
        ).value =
            settings.monthlyPayment;


        document.getElementById(
            "startDate"
        ).value =
            settings.startDate;

    }else{

        document.getElementById(
            "startDate"
        ).value =
            getDefaultStartMonth();

    }


    render();

}


/* =================================
   設定保存
================================= */

function saveSettings(){

    const loanAmount =
        Number(
            document.getElementById(
                "loanAmount"
            ).value
        );


    const monthlyPayment =
        Number(
            document.getElementById(
                "monthlyPayment"
            ).value
        );


    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    if(
        !loanAmount ||
        !monthlyPayment ||
        !startDate
    ){

        alert(
            "借入残高・毎月の返済額・初回返済月を入力してください"
        );

        return;

    }


    if(monthlyPayment <= 0){

        alert(
            "毎月の返済額を正しく入力してください"
        );

        return;

    }


    localStorage.setItem(
        "repaymentSettings",
        JSON.stringify({

            loanAmount,
            monthlyPayment,
            startDate

        })
    );


    localStorage.removeItem(
        "repaymentPaid"
    );


    render();


    alert(
        "設定を保存しました！"
    );

}


/* =================================
   設定取得
================================= */

function getSettings(){

    return JSON.parse(
        localStorage.getItem(
            "repaymentSettings"
        ) || "null"
    );

}


/* =================================
   返済回数
================================= */

function getPaymentCount(){

    const settings =
        getSettings();


    if(!settings){

        return 0;

    }


    return Math.ceil(
        settings.loanAmount /
        settings.monthlyPayment
    );

}


/* =================================
   月末
================================= */

function getLastDayOfMonth(
    year,
    month
){

    return new Date(
        year,
        month,
        0
    ).getDate();

}


/* =================================
   返済期間
================================= */

function formatPaymentPeriod(
    year,
    month
){

    const lastDay =
        getLastDayOfMonth(
            year,
            month
        );


    return (
        year +
        "/" +
        String(month).padStart(2,"0") +
        "/26〜" +
        year +
        "/" +
        String(month).padStart(2,"0") +
        "/" +
        lastDay
    );

}


/* =================================
   返済予定作成
================================= */

function generatePayments(){

    const settings =
        getSettings();


    if(!settings){

        return [];

    }


    const totalCount =
        getPaymentCount();


    const [
        startYear,
        startMonth
    ] =
        settings.startDate
        .split("-")
        .map(Number);


    const payments = [];


    let remaining =
        settings.loanAmount;


    for(
        let i = 0;
        i < totalCount;
        i++
    ){

        const date =
            new Date(
                startYear,
                startMonth - 1 + i,
                1
            );


        const year =
            date.getFullYear();


        const month =
            date.getMonth() + 1;


        const payment =
            Math.min(
                settings.monthlyPayment,
                remaining
            );


        remaining -=
            payment;


        payments.push({

            number:
                i + 1,

            year,

            month,

            period:
                formatPaymentPeriod(
                    year,
                    month
                ),

            payment,

            remaining

        });

    }


    return payments;

}


/* =================================
   返済済み取得
================================= */

function getPaid(){

    return JSON.parse(
        localStorage.getItem(
            "repaymentPaid"
        ) || "[]"
    );

}


/* =================================
   今月返済
================================= */

function payThisMonth(){

    const settings =
        getSettings();


    if(!settings){

        alert(
            "先に返済設定を保存してください"
        );

        return;

    }


    const today =
        new Date();


    const day =
        today.getDate();


    if(day < 26){

        alert(
            "今月の返済期間は26日〜月末です。\n\n26日以降に「今月返済した！」を押してください。"
        );

        return;

    }


    const year =
        today.getFullYear();


    const month =
        today.getMonth() + 1;


    const payments =
        generatePayments();


    const currentPayment =
        payments.find(
            p =>
                p.year === year &&
                p.month === month
        );


    if(!currentPayment){

        alert(
            "今月は返済予定がありません。"
        );

        return;

    }


    let paid =
        getPaid();


    if(
        paid.includes(
            currentPayment.number
        )
    ){

        alert(
            "今月分はすでに返済済みです。"
        );

        return;

    }


    paid.push(
        currentPayment.number
    );


    localStorage.setItem(
        "repaymentPaid",
        JSON.stringify(paid)
    );


    render();


    alert(
        currentPayment.payment.toLocaleString() +
        "円を返済済みとして記録しました！"
    );

}


/* =================================
   今月ボタン状態
================================= */

function updateThisMonthStatus(){

    const button =
        document.getElementById(
            "thisMonthButton"
        );


    const message =
        document.getElementById(
            "monthPaid"
        );


    const settings =
        getSettings();


    if(!settings){

        button.disabled =
            true;

        message.textContent =
            "";

        return;

    }


    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        today.getMonth() + 1;


    const payments =
        generatePayments();


    const currentPayment =
        payments.find(
            p =>
                p.year === year &&
                p.month === month
        );


    if(!currentPayment){

        button.disabled =
            true;

        button.textContent =
            "📅 今月の返済予定なし";

        message.textContent =
            "";

        return;

    }


    const paid =
        getPaid();


    if(
        paid.includes(
            currentPayment.number
        )
    ){

        button.disabled =
            true;

        button.textContent =
            "✅ 今月分は返済済みです！";

        message.textContent =
            "今月分の返済は記録されています。";

        return;

    }


    if(
        today.getDate() < 26
    ){

        button.disabled =
            true;

        button.textContent =
            "⏳ 今月の返済期間前";

        message.textContent =
            "返済期間は26日〜月末です。";

        return;

    }


    button.disabled =
        false;

    button.textContent =
        "✅ 今月返済した！";

    message.textContent =
        "";

}


/* =================================
   花火アニメーション
================================= */

let fireworksAnimation = null;


function launchFireworks(){

    const canvas =
        document.getElementById(
            "fireworksCanvas"
        );


    const celebration =
        document.getElementById(
            "celebration"
        );


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;


    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;


    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );


    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    canvas.style.display =
        "block";


    celebration.style.display =
        "flex";


    const particles = [];


    const rockets = [];


    let startTime =
        Date.now();


    const duration =
        7000;


    function randomColor(){

        const colors = [

            "#ff5252",
            "#ffeb3b",
            "#69f0ae",
            "#40c4ff",
            "#e040fb",
            "#ff9800",
            "#ffffff"

        ];


        return colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    }


    function createRocket(){

        rockets.push({

            x:
                Math.random() *
                width,

            y:
                height + 10,

            targetY:
                height *
                (
                    0.15 +
                    Math.random() *
                    0.4
                ),

            speed:
                7 +
                Math.random() * 4,

            color:
                randomColor()

        });

    }


    function explode(
        x,
        y,
        color
    ){

        const count =
            70 +
            Math.floor(
                Math.random() * 40
            );


        for(
            let i = 0;
            i < count;
            i++
        ){

            const angle =
                Math.random() *
                Math.PI *
                2;


            const speed =
                1.5 +
                Math.random() * 5;


            particles.push({

                x,
                y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                life:
                    70 +
                    Math.random() * 40,

                maxLife:
                    110,

                size:
                    1.5 +
                    Math.random() * 2,

                color

            });

        }

    }


    function animate(){

        const now =
            Date.now();


        const elapsed =
            now - startTime;


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /* ロケット */
        for(
            let i = rockets.length - 1;
            i >= 0;
            i--
        ){

            const rocket =
                rockets[i];


            rocket.y -=
                rocket.speed;


            ctx.beginPath();

            ctx.arc(
                rocket.x,
                rocket.y,
                2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                rocket.color;

            ctx.fill();


            if(
                rocket.y <=
                rocket.targetY
            ){

                explode(
                    rocket.x,
                    rocket.y,
                    rocket.color
                );


                rockets.splice(
                    i,
                    1
                );

            }

        }


        /* 粒 */
        for(
            let i = particles.length - 1;
            i >= 0;
            i--
        ){

            const p =
                particles[i];


            p.x +=
                p.vx;


            p.y +=
                p.vy;


            p.vy +=
                0.045;


            p.vx *=
                0.985;


            p.life -=
                1;


            const alpha =
                Math.max(
                    0,
                    p.life /
                    p.maxLife
                );


            ctx.globalAlpha =
                alpha;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                p.color;


            ctx.fill();


            if(
                p.life <= 0
            ){

                particles.splice(
                    i,
                    1
                );

            }

        }


        ctx.globalAlpha =
            1;


        /* 次の花火 */
        if(
            elapsed < duration
        ){

            if(
                Math.random() < 0.07
            ){

                createRocket();

            }

            fireworksAnimation =
                requestAnimationFrame(
                    animate
                );

        }else{

            finishFireworks();

        }

    }


    /* 最初から何発か */
    for(
        let i = 0;
        i < 3;
        i++
    ){

        setTimeout(
            createRocket,
            i * 400
        );

    }


    animate();

}


/* =================================
   花火終了
================================= */

function finishFireworks(){

    const canvas =
        document.getElementById(
            "fireworksCanvas"
        );


    const celebration =
        document.getElementById(
            "celebration"
        );


    cancelAnimationFrame(
        fireworksAnimation
    );


    canvas.style.display =
        "none";


    celebration.style.display =
        "none";

}


/* =================================
   完済判定
================================= */

let previousComplete =
    false;


function checkCompletion(
    remainingAmount
){

    const isComplete =
        remainingAmount <= 0;


    if(
        isComplete &&
        !previousComplete
    ){

        launchFireworks();

    }


    previousComplete =
        isComplete;

}


/* =================================
   画面表示
================================= */

function render(){

    const settings =
        getSettings();


    if(!settings){

        document.getElementById(
            "remainingAmount"
        ).textContent =
            "0円";


        document.getElementById(
            "remainingCount"
        ).textContent =
            "0回";


        document.getElementById(
            "paidCount"
        ).textContent =
            "0回";


        document.getElementById(
            "totalCount"
        ).textContent =
            "0回";


        document.getElementById(
            "progress"
        ).style.width =
            "0%";


        document.getElementById(
            "progressText"
        ).textContent =
            "0%";


        document.getElementById(
            "paymentList"
        ).innerHTML =
            "";


        const complete =
            document.getElementById(
                "completeMessage"
            );


        if(complete){

            complete.classList.add(
                "hidden"
            );

        }


        previousComplete =
            false;


        updateThisMonthStatus();

        return;

    }


    const payments =
        generatePayments();


    const paid =
        getPaid();


    const totalCount =
        payments.length;


    const paidCount =
        paid.length;


    let remainingAmount =
        settings.loanAmount;


    payments.forEach(
        payment => {

            if(
                paid.includes(
                    payment.number
                )
            ){

                remainingAmount -=
                    payment.payment;

            }

        }
    );


    remainingAmount =
        Math.max(
            0,
            remainingAmount
        );


    const remainingCount =
        Math.max(
            0,
            totalCount - paidCount
        );


    const progress =
        settings.loanAmount > 0
        ?
        (
            (
                settings.loanAmount -
                remainingAmount
            )
            /
            settings.loanAmount
        )
        * 100
        :
        0;


    document.getElementById(
        "remainingAmount"
    ).textContent =
        remainingAmount.toLocaleString() +
        "円";


    document.getElementById(
        "remainingCount"
    ).textContent =
        remainingCount +
        "回";


    document.getElementById(
        "paidCount"
    ).textContent =
        paidCount +
        "回";


    document.getElementById(
        "totalCount"
    ).textContent =
        totalCount +
        "回";


    document.getElementById(
        "progress"
    ).style.width =
        Math.min(
            100,
            Math.max(
                0,
                progress
            )
        ) +
        "%";


    document.getElementById(
        "progressText"
    ).textContent =
        Math.round(
            Math.min(
                100,
                Math.max(
                    0,
                    progress
                )
            )
        ) +
        "%";


    /* 返済予定 */

    const list =
        document.getElementById(
            "paymentList"
        );


    list.innerHTML =
        "";


    payments.forEach(
        payment => {

            const isPaid =
                paid.includes(
                    payment.number
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "payment-item" +
                (
                    isPaid
                    ? " paid"
                    : ""
                );


            item.innerHTML = `

                <div class="payment-main">

                    <div class="payment-number">
                        ${payment.number}回目
                    </div>

                    <div class="payment-period">
                        ${payment.period}
                    </div>

                </div>

                <div class="payment-right">

                    <div class="payment-amount">
                        ${payment.payment.toLocaleString()}円
                    </div>

                    ${
                        isPaid
                        ?
                        `
                        <div class="paid-mark">
                            ✓ 返済済み
                        </div>
                        `
                        :
                        ""
                    }

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    /* 完済メッセージ */

    let complete =
        document.getElementById(
            "completeMessage"
        );


    if(!complete){

        complete =
            document.createElement(
                "div"
            );


        complete.id =
            "completeMessage";


        complete.className =
            "complete";


        document.querySelector(
            ".container"
        ).insertBefore(
            complete,
            document.querySelector(
                ".card:last-child"
            )
        );

    }


    if(
        remainingAmount <= 0
    ){

        complete.classList.remove(
            "hidden"
        );


        complete.textContent =
            "🎉 完済しました！お疲れさまでした！";

    }else{

        complete.classList.add(
            "hidden"
        );

    }


    /* 完済した瞬間に花火 */

    checkCompletion(
        remainingAmount
    );


    updateThisMonthStatus();

}


/* =================================
   データリセット
================================= */

function resetData(){

    const result =
        confirm(
            "返済設定と返済記録をすべて削除しますか？"
        );


    if(!result){

        return;

    }


    localStorage.removeItem(
        "repaymentSettings"
    );


    localStorage.removeItem(
        "repaymentPaid"
    );


    scheduleOpen =
        false;


    previousComplete =
        false;


    finishFireworks();


    const list =
        document.getElementById(
            "paymentList"
        );


    const button =
        document.getElementById(
            "scheduleToggle"
        );


    list.classList.add(
        "hidden"
    );


    button.textContent =
        "📅 返済予定を見る";


    document.getElementById(
        "loanAmount"
    ).value =
        "";


    document.getElementById(
        "monthlyPayment"
    ).value =
        "";


    document.getElementById(
        "startDate"
    ).value =
        getDefaultStartMonth();


    render();

}


/* =================================
   起動
================================= */

initialize();

</script>

</html>
