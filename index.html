<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1976d2">

<title>返済計画</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:sans-serif;
    background:#f3f6f9;
    color:#333;
}

.container{
    max-width:600px;
    margin:0 auto;
}

/* ヘッダー */

.header{
    background:#1976d2;
    color:white;
    padding:20px 15px;
    border-radius:15px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
}

/* カード */

.card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card h2{
    margin:0 0 15px;
    font-size:19px;
}

/* 金額表示 */

.main-amount{
    text-align:center;
    padding:10px 0 18px;
}

.main-amount .label{
    font-size:14px;
    color:#777;
}

.main-amount .amount{
    font-size:36px;
    font-weight:bold;
    color:#1976d2;
    margin-top:5px;
}

/* 情報 */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.info-box{
    background:#f5f7fa;
    border-radius:10px;
    padding:13px;
    text-align:center;
}

.info-box .label{
    font-size:13px;
    color:#777;
}

.info-box .value{
    font-size:21px;
    font-weight:bold;
    margin-top:5px;
}

/* 入力 */

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:13px;
    font-size:17px;
    border:1px solid #ccc;
    border-radius:9px;
}

.input-group input:focus{
    outline:none;
    border-color:#1976d2;
}

/* ボタン */

button{
    border:none;
    border-radius:9px;
    padding:13px 16px;
    font-size:16px;
    cursor:pointer;
}

.primary{
    width:100%;
    background:#1976d2;
    color:white;
}

.secondary{
    width:100%;
    background:#e8edf2;
    color:#333;
}

.danger{
    width:100%;
    background:#e53935;
    color:white;
}

/* 今月返済ボタン */

.this-month-button{
    width:100%;
    background:#2e7d32;
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:16px;
    margin-bottom:12px;
}

.this-month-button:active{
    transform:scale(0.98);
}

.this-month-note{
    text-align:center;
    font-size:12px;
    color:#777;
    margin:0;
    line-height:1.6;
}

/* 今月返済済み */

.month-paid{
    display:none;
    text-align:center;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:10px;
    padding:13px;
    font-weight:bold;
    margin-top:10px;
}

/* 進捗 */

.progress-area{
    margin:15px 0;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
}

.progress{
    width:100%;
    height:14px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1976d2;
    transition:width 0.3s;
}

/* 返済リスト */

.payment-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.payment-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:10px;
    background:#f5f7fa;
    border:1px solid #eee;
}

.payment-item.paid{
    background:#e8f5e9;
    border-color:#c8e6c9;
}

.payment-number{
    width:42px;
    font-weight:bold;
    color:#777;
    flex-shrink:0;
}

.payment-date{
    flex:1;
}

.payment-date .date{
    font-weight:bold;
}

.payment-date .remaining{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.payment-money{
    font-weight:bold;
    white-space:nowrap;
}

.paid-mark{
    color:#2e7d32;
    font-size:12px;
    font-weight:bold;
    margin-top:3px;
}

/* 最終メッセージ */

.complete{
    display:none;
    text-align:center;
    padding:20px;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.note{
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.footer{
    text-align:center;
    color:#999;
    font-size:12px;
    padding:15px 0 30px;
}

</style>
</head>

<body>

<div class="container">

    <!-- ヘッダー -->

    <div class="header">

        <h1>💰 返済計画</h1>

        <p>
            無利息・毎月コツコツ返済
        </p>

    </div>


    <!-- 現在の残高 -->

    <div class="card">

        <div class="main-amount">

            <div class="label">
                現在の残り返済額
            </div>

            <div
                class="amount"
                id="remainingAmount"
            >
                680,000円
            </div>

        </div>


        <div class="info-grid">

            <div class="info-box">

                <div class="label">
                    借入金額
                </div>

                <div class="value">
                    680,000円
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    毎月返済
                </div>

                <div class="value">
                    10,000円
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    残り回数
                </div>

                <div
                    class="value"
                    id="remainingCount"
                >
                    68回
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    返済済み
                </div>

                <div
                    class="value"
                    id="paidCount"
                >
                    0回
                </div>

            </div>

        </div>

    </div>


    <!-- 設定 -->

    <div class="card">

        <h2>⚙️ 返済設定</h2>


        <div class="input-group">

            <label>
                借入金額
            </label>

            <input
                type="number"
                id="loanAmount"
                value="680000"
                min="0"
            >

        </div>


        <div class="input-group">

            <label>
                毎月の返済額
            </label>

            <input
                type="number"
                id="monthlyPayment"
                value="10000"
                min="1"
            >

        </div>


        <div class="input-group">

            <label>
                初回返済月
            </label>

            <input
                type="month"
                id="startDate"
            >

            <div class="note">
                ※返済期間は毎月「26日〜月末」です
            </div>

        </div>


        <button
            class="primary"
            onclick="saveSettings()"
        >
            💾 返済計画を作成・更新
        </button>

    </div>


    <!-- 今月の返済 -->

    <div class="card">

        <h2>💴 今月の返済</h2>


        <button
            class="this-month-button"
            id="thisMonthButton"
            onclick="payThisMonth()"
        >
            ✅ 今月返済した！
        </button>


        <div
            class="month-paid"
            id="monthPaid"
        >
            ✅ 今月分は返済済みです！
        </div>


        <p class="this-month-note">
            給料から1万円が天引きされたら押してください
        </p>

    </div>


    <!-- 進捗 -->

    <div class="card">

        <h2>📊 返済進捗</h2>


        <div class="progress-area">

            <div class="progress-text">

                <span id="progressLeft">
                    0回 / 68回
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>

    </div>


    <!-- 完済 -->

    <div
        class="complete"
        id="completeMessage"
    >
        🎉 完済おめでとう！<br>
        返済がすべて完了しました！
    </div>


    <!-- 返済予定 -->

    <div class="card">

        <div class="schedule-header">

            <h2>📅 返済予定</h2>

        </div>


        <div
            class="payment-list"
            id="paymentList"
        ></div>

    </div>


    <!-- データ管理 -->

    <div class="card">

        <h2>🔧 データ管理</h2>


        <p class="note">

            返済済みの記録や返済設定は、
            このスマホのブラウザに保存されます。

        </p>


        <br>


        <button
            class="danger"
            onclick="resetData()"
        >
            🗑️ すべてリセット
        </button>

    </div>


    <div class="footer">
        返済計画アプリ
    </div>

</div>


<script>

/* =========================
   初期設定
========================= */

const DEFAULT_LOAN = 680000;

const DEFAULT_MONTHLY = 10000;


/* =========================
   今日の日付
========================= */

function getToday(){

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =========================
   初回返済月
========================= */

function getDefaultStartMonth(){

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    return `${year}-${month}`;

}


/* =========================
   初期表示
========================= */

function initialize(){

    const saved =
        localStorage.getItem(
            "repaymentSettings"
        );


    if(saved){

        const settings =
            JSON.parse(saved);


        document.getElementById(
            "loanAmount"
        ).value =
            settings.loanAmount;


        document.getElementById(
            "monthlyPayment"
        ).value =
            settings.monthlyPayment;


        let startMonth =
            settings.startDate || "";


        if(startMonth.length >= 7){

            startMonth =
                startMonth.substring(0,7);

        }


        document.getElementById(
            "startDate"
        ).value =
            startMonth;

    }else{

        document.getElementById(
            "loanAmount"
        ).value =
            DEFAULT_LOAN;


        document.getElementById(
            "monthlyPayment"
        ).value =
            DEFAULT_MONTHLY;


        document.getElementById(
            "startDate"
        ).value =
            getDefaultStartMonth();

    }


    render();

}


/* =========================
   設定保存
========================= */

function saveSettings(){

    const loanAmount =
        Number(
            document.getElementById(
                "loanAmount"
            ).value
        );


    const monthlyPayment =
        Number(
            document.getElementById(
                "monthlyPayment"
            ).value
        );


    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    if(loanAmount <= 0){

        alert(
            "借入金額を入力してください。"
        );

        return;

    }


    if(monthlyPayment <= 0){

        alert(
            "毎月の返済額を入力してください。"
        );

        return;

    }


    if(!startDate){

        alert(
            "初回返済月を入力してください。"
        );

        return;

    }


    const settings = {

        loanAmount:
            loanAmount,

        monthlyPayment:
            monthlyPayment,

        startDate:
            startDate

    };


    localStorage.setItem(
        "repaymentSettings",
        JSON.stringify(settings)
    );


    const answer =
        confirm(
            "返済設定を更新しました。\n\n" +
            "返済済み記録をリセットしますか？"
        );


    if(answer){

        localStorage.removeItem(
            "repaymentPaid"
        );

    }


    render();


    alert(
        "返済計画を更新しました！"
    );

}


/* =========================
   設定取得
========================= */

function getSettings(){

    const saved =
        localStorage.getItem(
            "repaymentSettings"
        );


    if(saved){

        const settings =
            JSON.parse(saved);


        let startDate =
            settings.startDate || "";


        if(startDate.length >= 7){

            startDate =
                startDate.substring(0,7);

        }


        return {

            loanAmount:
                Number(
                    settings.loanAmount
                ),

            monthlyPayment:
                Number(
                    settings.monthlyPayment
                ),

            startDate:
                startDate

        };

    }


    return {

        loanAmount:
            DEFAULT_LOAN,

        monthlyPayment:
            DEFAULT_MONTHLY,

        startDate:
            getDefaultStartMonth()

    };

}


/* =========================
   返済回数
========================= */

function getPaymentCount(
    loanAmount,
    monthlyPayment
){

    return Math.ceil(
        loanAmount /
        monthlyPayment
    );

}


/* =========================
   月末の日付
========================= */

function getLastDayOfMonth(
    year,
    month
){

    return new Date(
        year,
        month + 1,
        0
    ).getDate();

}


/* =========================
   返済期間表示
========================= */

function formatPaymentPeriod(
    year,
    month
){

    const lastDay =
        getLastDayOfMonth(
            year,
            month
        );


    const monthText =
        String(
            month + 1
        ).padStart(2,"0");


    const lastDayText =
        String(
            lastDay
        ).padStart(2,"0");


    return `${year}/${monthText}/26〜${year}/${monthText}/${lastDayText}`;

}


/* =========================
   返済予定作成
========================= */

function generatePayments(){

    const settings =
        getSettings();


    const loanAmount =
        settings.loanAmount;


    const monthlyPayment =
        settings.monthlyPayment;


    const startMonth =
        settings.startDate;


    const startYear =
        Number(
            startMonth.substring(0,4)
        );


    const startMonthNumber =
        Number(
            startMonth.substring(5,7)
        );


    const count =
        getPaymentCount(
            loanAmount,
            monthlyPayment
        );


    const payments = [];


    for(
        let i = 0;
        i < count;
        i++
    ){

        const date =
            new Date(
                startYear,
                startMonthNumber - 1 + i,
                1
            );


        const year =
            date.getFullYear();


        const month =
            date.getMonth();


        const paidBefore =
            i * monthlyPayment;


        const remainingBefore =
            loanAmount -
            paidBefore;


        const payment =
            Math.min(
                monthlyPayment,
                remainingBefore
            );


        const remainingAfter =
            remainingBefore -
            payment;


        payments.push({

            number:
                i + 1,

            year:
                year,

            month:
                month,

            period:
                formatPaymentPeriod(
                    year,
                    month
                ),

            payment:
                payment,

            remaining:
                remainingAfter

        });

    }


    return payments;

}


/* =========================
   返済済みデータ
========================= */

function getPaid(){

    const saved =
        localStorage.getItem(
            "repaymentPaid"
        );


    if(saved){

        return JSON.parse(saved);

    }


    return [];

}


/* =========================
   今月返済した
========================= */

function payThisMonth(){

    const today =
        new Date();


    const todayYear =
        today.getFullYear();


    const todayMonth =
        today.getMonth();


    const todayDay =
        today.getDate();


    /*
       返済期間は26日〜月末
    */

    if(todayDay < 26){

        alert(
            "今月の返済期間は\n" +
            "26日〜月末です。\n\n" +
            "給料から天引きされたら\n" +
            "「今月返済した！」を押してください。"
        );

        return;

    }


    const payments =
        generatePayments();


    let paid =
        getPaid();


    const currentPayment =
        payments.find(
            payment =>
                payment.year === todayYear &&
                payment.month === todayMonth
        );


    if(!currentPayment){

        alert(
            "今月の返済予定が見つかりません。"
        );

        return;

    }


    if(
        paid.includes(
            currentPayment.number
        )
    ){

        alert(
            "今月分はすでに\n" +
            "返済済みになっています。"
        );

        return;

    }


    /*
       返済済みに追加
    */

    paid.push(
        currentPayment.number
    );


    localStorage.setItem(
        "repaymentPaid",
        JSON.stringify(paid)
    );


    render();


    alert(
        "今月分の返済を記録しました！\n\n" +
        currentPayment.payment.toLocaleString() +
        "円\n\n" +
        "おつかれさま！👍"
    );

}


/* =========================
   今月の状態表示
========================= */

function updateThisMonthStatus(){

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        today.getMonth();


    const day =
        today.getDate();


    const payments =
        generatePayments();


    const paid =
        getPaid();


    const currentPayment =
        payments.find(
            payment =>
                payment.year === year &&
                payment.month === month
        );


    const button =
        document.getElementById(
            "thisMonthButton"
        );


    const monthPaid =
        document.getElementById(
            "monthPaid"
        );


    /*
       今月分が返済済み
    */

    if(
        currentPayment &&
        paid.includes(
            currentPayment.number
        )
    ){

        button.style.display =
            "none";

        monthPaid.style.display =
            "block";

        return;

    }


    /*
       まだ返済していない
    */

    button.style.display =
        "block";

    monthPaid.style.display =
        "none";


    /*
       26日より前
    */

    if(day < 26){

        button.textContent =
            "⏳ 今月の返済期間前";

    }else{

        button.textContent =
            "✅ 今月返済した！";

    }

}


/* =========================
   メイン表示
========================= */

function render(){

    const settings =
        getSettings();


    const payments =
        generatePayments();


    const paid =
        getPaid();


    const total =
        settings.loanAmount;


    const totalCount =
        payments.length;


    /*
       実際に存在する返済番号だけを
       返済済みとして数える
    */

    const validPaid =
        paid.filter(
            number =>
                payments.some(
                    payment =>
                        payment.number === number
                )
        );


    const paidCount =
        validPaid.length;


    let remaining =
        total;


    /*
       返済済み分を計算
    */

    payments.forEach(
        payment => {

            if(
                validPaid.includes(
                    payment.number
                )
            ){

                remaining -=
                    payment.payment;

            }

        }
    );


    if(remaining < 0){

        remaining = 0;

    }


    /* 残高 */

    document.getElementById(
        "remainingAmount"
    ).textContent =
        remaining.toLocaleString() +
        "円";


    /* 残り回数 */

    const remainingCount =
        Math.max(
            0,
            totalCount - paidCount
        );


    document.getElementById(
        "remainingCount"
    ).textContent =
        remainingCount +
        "回";


    /* 返済済み */

    document.getElementById(
        "paidCount"
    ).textContent =
        paidCount +
        "回";


    /* 進捗 */

    const percent =
        totalCount === 0
        ? 0
        : Math.round(
            paidCount /
            totalCount *
            100
        );


    document.getElementById(
        "progressLeft"
    ).textContent =
        `${paidCount}回 / ${totalCount}回`;


    document.getElementById(
        "progressPercent"
    ).textContent =
        percent +
        "%";


    document.getElementById(
        "progressBar"
    ).style.width =
        percent +
        "%";


    /* 完済メッセージ */

    if(
        remaining <= 0 ||
        paidCount >= totalCount
    ){

        document.getElementById(
            "completeMessage"
        ).style.display =
            "block";

    }else{

        document.getElementById(
            "completeMessage"
        ).style.display =
            "none";

    }


    /* =========================
       返済予定リスト
       ※チェックボックスなし
    ========================= */

    const list =
        document.getElementById(
            "paymentList"
        );


    list.innerHTML = "";


    payments.forEach(
        payment => {

            const isPaid =
                validPaid.includes(
                    payment.number
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "payment-item" +
                (
                    isPaid
                    ? " paid"
                    : ""
                );


            item.innerHTML = `

                <div class="payment-number">
                    ${payment.number}
                </div>

                <div class="payment-date">

                    <div class="date">
                        ${payment.period}
                    </div>

                    <div class="remaining">
                        返済後残高：
                        ${payment.remaining.toLocaleString()}円
                    </div>

                </div>

                <div class="payment-money">

                    ${payment.payment.toLocaleString()}円

                    ${
                        isPaid
                        ? '<div class="paid-mark">返済済み</div>'
                        : ''
                    }

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    /*
       今月返済ボタンの状態更新
    */

    updateThisMonthStatus();

}


/* =========================
   データリセット
========================= */

function resetData(){

    const answer =
        confirm(
            "返済設定と返済済みデータを\n" +
            "すべて削除します。\n\n" +
            "本当にリセットしますか？"
        );


    if(!answer){

        return;

    }


    localStorage.removeItem(
        "repaymentSettings"
    );


    localStorage.removeItem(
        "repaymentPaid"
    );


    document.getElementById(
        "loanAmount"
    ).value =
        DEFAULT_LOAN;


    document.getElementById(
        "monthlyPayment"
    ).value =
        DEFAULT_MONTHLY;


    document.getElementById(
        "startDate"
    ).value =
        getDefaultStartMonth();


    render();


    alert(
        "リセットしました。"
    );
